  <rect width="320" height="96" rx="20" fill="url(#bg)"/>
  <path d="M48 25H38c-5 0-8 4-8 9v27c0 5 3 9 8 9h10M66 25h10c5 0 8 4 8 9v27c0 5-3 9-8 9H66" fill="none" stroke="url(#bracket)" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/>
