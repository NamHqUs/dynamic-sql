      <stop stop-color="#312018"/>
      <stop offset="1" stop-color="#171322"/>
    </linearGradient>
    <linearGradient id="bracket" x1="20" y1="25" x2="78" y2="70" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fb923c"/>
