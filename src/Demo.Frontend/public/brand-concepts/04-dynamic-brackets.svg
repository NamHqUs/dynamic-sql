  <text x="101" y="59" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="500" letter-spacing="-.9"><tspan fill="#fff1dc" font-weight="800">D</tspan><tspan fill="#f8eadd">ynamic</tspan><tspan fill="#fbbf24" font-weight="900">SQL</tspan></text>
  <path d="M249 68h34" stroke="#facc15" stroke-linecap="round" stroke-width="3"/>
  <path d="m278 63 6 5-6 5" fill="none" stroke="#facc15" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"/>
