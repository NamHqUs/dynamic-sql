Name: 13. Discount impact by month
Query:
  Entity: Invoices
  Fields:
    - DateFormat(InvoiceDate, <%Y-%m>) | Month
    - Sum(DiscountAmount) | Discounts
    - Sum(TotalAmount) | NetRevenue
    - Round(Sum(DiscountAmount) * <100> / NullIf(Sum(TotalAmount), <0>), <2>) | DiscountRate
  Filter:
  Sorts: Month ASC
  Page:
  PageSize:
