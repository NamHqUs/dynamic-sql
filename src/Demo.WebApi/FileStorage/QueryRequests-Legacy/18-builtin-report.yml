Name: 18. Monthly revenue trend with prior month
# Partial: the DSL cannot express LAG(...) OVER (...); this defines only the monthly revenue result.
Entity: Invoices
Fields:
  - DateFormat(InvoiceDate, <%Y-%m>) | Month
  - Sum(TotalAmount) | Revenue
Filter: Status = <Paid>
Sorts: Month ASC
Page:
PageSize:
