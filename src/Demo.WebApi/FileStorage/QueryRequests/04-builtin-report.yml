Name: 4. Best-selling products by units and revenue
Query:
  Entity: Products
  Fields:
    - Name
    - Category
    - Sum(InvoiceItems.Quantity) | UnitsSold
    - Sum(InvoiceItems.LineTotal) | Revenue
    - Id | ProductId
  Filter: InvoiceItems.Invoice.Status = <Paid>
  Sorts: Revenue DESC
  Page:
  PageSize:
