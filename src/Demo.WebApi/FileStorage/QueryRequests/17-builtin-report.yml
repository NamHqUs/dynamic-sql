Name: 17. Category revenue and profitability
Query:
  Entity: Products
  Fields:
    - Category
    - Sum(InvoiceItems.LineTotal) | Revenue
    - Sum(InvoiceItems.LineTotal - (InvoiceItems.Quantity * CostPrice)) | GrossProfit
  Filter: InvoiceItems.Invoice.Status = <Paid>
  Sorts: Revenue DESC
  Page:
  PageSize:
