# Partial: DateSub returns whole days; the SQL averages fractional julianday differences.
Name: 7. Paid collection time by payment method
Entity: Invoices
Fields:
  - PaymentMethod
  - Count() | PaidInvoices
  - Average(DateSub(InvoiceDate, PaidOn)) | AverageDaysToPay
  - Sum(TotalAmount) | Collected
Filter: Status = <Paid>
Sorts:
Page:
PageSize:
