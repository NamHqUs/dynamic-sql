# CustomerId preserves the source grouping by c.Id; it is an extra projected field.
Name: 10. Customers with repeat purchases
Entity: Customers
Fields:
  - Name
  - Count(Invoices.Id) | OrderCount
  - Max(Invoices.InvoiceDate) | LastOrderDate
  - Id | CustomerId
Filter: Invoices.Status = <Paid> AND Count(Invoices.Id) > <1>
Sorts:
Page:
PageSize:
