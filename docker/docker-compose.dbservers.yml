services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "NoPassword123!"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - dbnet

  postgres:
    image: postgres:17
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "NoPassword123!"
      POSTGRES_DB: DynamicSqlTest
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dbnet

  sqlite:
    image: alpine:3.20
    container_name: sqlite
    working_dir: /data
    volumes:
      - ./sqlite-data:/data
      - ../scripts:/scripts:ro
    command:
      - /bin/sh
      - -c
      - |
        apk add --no-cache sqlite
        sed '/^PRAGMA foreign_keys/d;/^ATTACH DATABASE/d' /scripts/northstar-demo.sqlite.sql > /tmp/northstar-demo.sqlite.sql
        cat > /tmp/sqlite-init.sql <<'EOF'
        ATTACH DATABASE '/data/hr.db' AS hr;
        ATTACH DATABASE '/data/sa.db' AS sa;
        ATTACH DATABASE '/data/he.db' AS he;
        ATTACH DATABASE '/data/in.db' AS "in";
        .read /tmp/northstar-demo.sqlite.sql
        EOF
        sqlite3 /data/main.db < /tmp/sqlite-init.sql
        tail -f /dev/null
    networks:
      - dbnet

  # cloudbeaver:
  #   image: dbeaver/cloudbeaver:latest
  #   container_name: cloudbeaver
  #   ports:
  #     - "8978:8978"
  #   volumes:
  #     - cloudbeaver_data:/opt/cloudbeaver/workspace
  #   depends_on:
  #     - sqlserver
  #     - postgres
  #   networks:
  #     - dbnet

volumes:
  sqlserver_data:
  postgres_data:
  cloudbeaver_data:

networks:
  dbnet: